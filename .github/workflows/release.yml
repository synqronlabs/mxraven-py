name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to PyPI
    # Publishing is deferred until the repository variable
    # PYPI_PUBLISH_ENABLED is set to "true" (Settings -> Secrets and variables
    # -> Actions -> Variables). Until then a tag push builds and validates the
    # distributions but never publishes to PyPI.
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mxraven
    permissions:
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uv run --with twine twine check dist/*

      - name: Publish with attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
