site_name: mxRaven Python SDK
site_description: Python SDK for the mxRaven mail runtime.
site_url: https://synqronlabs.github.io/mxraven-py/
repo_url: https://github.com/synqronlabs/mxraven-py
repo_name: synqronlabs/mxraven-py
edit_uri: edit/main/docs/

strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - SMTP submission: submission.md
  - Webhooks: webhooks.md
  - Feedback: feedback.md
  - Notifications: notifications.md
  - API reference: reference/index.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: true
            signature_crossrefs: true

watch:
  - src/mxraven

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
